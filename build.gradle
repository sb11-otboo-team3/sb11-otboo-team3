plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.otboo'
version = '0.0.1-SNAPSHOT'
description = 'Personalized outfit recommendation service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Monitoring
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// OpenAPI / Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Real-time communication
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Cache
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// Database
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	// Querydsl
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// AWS SDK
	implementation platform('software.amazon.awssdk:bom:2.48.0')
	implementation 'software.amazon.awssdk:s3'

	// Spring Batch
	implementation 'org.springframework.boot:spring-boot-starter-batch'

	// Configuration metadata
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.batch:spring-batch-test'

	// Test database
	testRuntimeOnly 'com.h2database:h2'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def jacocoExcludePatterns = [
		'**/Q*.class'
]

def jacocoClassDirectories = files(
		sourceSets.main.output.classesDirs.files.collect { classDirectory ->
			fileTree(
					dir: classDirectory,
					exclude: jacocoExcludePatterns
			)
		}
)

tasks.named('test') {
	useJUnitPlatform()

	// 테스트 완료 후 커버리지 보고서 생성
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')

	classDirectories.setFrom(jacocoClassDirectories)

	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
}

tasks.named('jacocoTestCoverageVerification') {
	classDirectories.setFrom(jacocoClassDirectories)
}
