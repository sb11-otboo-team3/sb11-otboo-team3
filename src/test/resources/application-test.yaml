spring:
  config:
    activate:
      on-profile: test
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:h2:mem:otboo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  cache:
    type: simple

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    redis:
      enabled: false

jwt:
  secret: k3kXIvo3YdC0cNUP2yMc9Rmhell9Te3CTFBlP3UA+ts=
  access-expiration: 900000
  refresh-expiration: 604800000
  admin-access-expiration: 300000

kakao:
  local:
    api-key: test-api-key
    base-url: https://dapi.kakao.com

kma:
  vilage-fcst:
    api-key: test-api-key
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0

app:
  # Client 생성만 하며 실제 Elasticsearch 접속은 발생하지 않는다.
  search:
    endpoint: http://localhost:9200
  websocket:
    allowed-origin-patterns: http://localhost:5173,http://localhost:3000,http://localhost:8080

  storage:
    s3:
      region: ap-northeast-2
      bucket: test-storage-bucket
      presigned-url-expiration-seconds: 600

    image:
      max-file-size-bytes: 10485760

  admin:
    init-email: admin@otboo.io
    init-name: admin
    init-password: admin1234!

logging:
  level:
    root: WARN
