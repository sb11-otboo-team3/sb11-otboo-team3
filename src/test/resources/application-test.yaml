spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:otboo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  cache:
    type: simple

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    redis:
      enabled: false

jwt:
  secret: k3kXIvo3YdC0cNUP2yMc9Rmhell9Te3CTFBlP3UA+ts=
  access-expiration: 900000
  refresh-expiration: 604800000

kakao:
  local:
    api-key: test-api-key
    base-url: https://dapi.kakao.com

kma:
  vilage-fcst:
    api-key: test-api-key
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0

app:
  websocket:
    allowed-origin-patterns: http://localhost:5173,http://localhost:3000,http://localhost:8080

  storage:
    s3:
      region: ap-northeast-2
      bucket: test-storage-bucket
      presigned-url-expiration-seconds: 600

    image:
      max-file-size-bytes: 10485760
