spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:otboo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  cache:
    type: simple

kakao:
  local:
    api-key: test-api-key
    base-url: https://dapi.kakao.com