spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:otboo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  cache:

jwt:
  secret: test-secret-key-for-integration-test-minimum-256-bits-required
  access-expiration: 900000
  refresh-expiration: 604800000