spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:otboo}
    username: ${DB_USERNAME:otboo}
    password: ${DB_PASSWORD:otboo}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  batch:
    jdbc:
      initialize-schema: never

jwt:
  secret: ${JWT_SECRET:3WayDafV59YynmTwCpaDtnpeur8sokrAkQ+wFlXO4QY=}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000,http://localhost:8080}


kakao:
  local:
    api-key: ${KAKAO_REST_API_KEY:kakao-rest-api-key}
    base-url: https://dapi.kakao.com

kma:
  vilage-fcst:
    api-key: ${KMA_API_KEY:kma-api-key}
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0

weather:
  cleanup:
    # TODO: 로컬 테스트용 임시 오버라이드 - 확인 끝나면 이 줄 지울 것 (운영은 새벽 4시 그대로, WeatherCleanupScheduler 기본값 참고)
    cron: "0 * * * * *"
  prefetch:
    # TODO: 로컬 테스트용 임시 오버라이드 - 확인 끝나면 이 줄 지울 것 (운영은 발표시각+15분 그대로, WeatherPrefetchScheduler 기본값 참고)
    cron: "0 */10 * * * *"