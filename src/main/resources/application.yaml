spring:
  application:
    name: otboo
  profiles:
    default: local
  mvc:
    async:
      request-timeout: 3600000
  jpa:
    open-in-view: false
  datasource:
    hikari:
      # 기본값(10)보다 늘림 - 날씨 프리패치 배치가 동시성 10(WeatherPrefetchJobConfig.CONCURRENCY)으로
      # 격자를 병렬 처리하는데, 기본 풀이면 배치가 커넥션을 거의 다 차지해서 그 순간 일반 API 요청이
      # 밀릴 수 있음. RDS(db.t4g.micro) 쪽 max_connections는 약 112개라 이 정도는 여유 있음.
      maximum-pool-size: 15
  batch:
    job:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
kakao:
  local:
    api-key: ${KAKAO_REST_API_KEY}
    base-url: https://dapi.kakao.com
kma:
  vilage-fcst:
    api-key: ${KMA_API_KEY}
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
app:
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET:local-storage-bucket}
      presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:600}
    image:
      max-file-size-bytes: ${IMAGE_MAX_FILE_SIZE_BYTES:10485760}
  admin:
    init-email: ${ADMIN_INIT_EMAIL:admin@otboo.io}
    init-name: ${ADMIN_INIT_NAME:admin}
    init-password: ${ADMIN_INIT_PASSWORD:admin1234!}