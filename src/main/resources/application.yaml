spring:
  application:
    name: otboo

  profiles:
    default: local

  jpa:
    open-in-view: false

  batch:
    job:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      show-components: never

kakao:
  local:
    api-key: ${KAKAO_REST_API_KEY}
    base-url: https://dapi.kakao.com

app:
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000,http://localhost:8080}