server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    activate:
      on-profile: prod
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  batch:
    jdbc:
      initialize-schema: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: INFO
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  admin-access-expiration: ${JWT_ADMIN_ACCESS_EXPIRATION:300000}
app:
  websocket:
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS}
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET}
      presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:600}
    image:
      max-file-size-bytes: ${IMAGE_MAX_FILE_SIZE_BYTES:10485760}
  admin:
    init-email: ${ADMIN_INIT_EMAIL}
    init-name: ${ADMIN_INIT_NAME}
    init-password: ${ADMIN_INIT_PASSWORD}