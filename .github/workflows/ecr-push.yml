name: Build and Push ECR Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-push-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: otboo/backend
  ECS_CLUSTER: otboo-prod-cluster
  ECS_SERVICE: otboo-prod-backend-service
  ECS_CONTAINER_NAME: otboo-backend

jobs:
  build-and-push:
    name: Build and Push ECR Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate workflow ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        shell: bash
        run: |
          echo "Manual ECR push is allowed only from develop."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c # v2.1.6

      - name: Check existing immutable image
        id: existing-image
        shell: bash
        run: |
          set -euo pipefail

          ERROR_FILE="$(mktemp)"

          set +e
          EXISTING_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$GITHUB_SHA" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text \
              --no-cli-pager \
              2>"$ERROR_FILE"
          )"
          DESCRIBE_STATUS=$?
          set -e

          if [ "$DESCRIBE_STATUS" -eq 0 ]; then
            test -n "$EXISTING_DIGEST"
            test "$EXISTING_DIGEST" != "None"

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$EXISTING_DIGEST" >> "$GITHUB_OUTPUT"
            echo "Existing immutable image found for ${GITHUB_SHA}."

            rm -f "$ERROR_FILE"
            exit 0
          fi

          if grep -q "ImageNotFoundException" "$ERROR_FILE"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing image found for ${GITHUB_SHA}."

            rm -f "$ERROR_FILE"
            exit 0
          fi

          cat "$ERROR_FILE"
          rm -f "$ERROR_FILE"
          exit "$DESCRIBE_STATUS"

      - name: Validate existing immutable image
        if: steps.existing-image.outputs.exists == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker pull \
            --platform linux/amd64 \
            "$IMAGE_URI"

          PULLED_DIGEST="$(
            docker image inspect "$IMAGE_URI" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^${REGISTRY}/${ECR_REPOSITORY}@" \
            | head -n 1 \
            | cut -d '@' -f 2
          )"

          IMAGE_OS="$(
            docker image inspect "$IMAGE_URI" \
              --format '{{.Os}}'
          )"

          IMAGE_ARCH="$(
            docker image inspect "$IMAGE_URI" \
              --format '{{.Architecture}}'
          )"

          IMAGE_REVISION="$(
            docker image inspect "$IMAGE_URI" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          test "$PULLED_DIGEST" = "$EXISTING_DIGEST" || {
            echo "Pulled image digest does not match the ECR digest."
            exit 1
          }

          test "$IMAGE_OS" = "linux" || {
            echo "Existing image OS is not linux: $IMAGE_OS"
            exit 1
          }

          test "$IMAGE_ARCH" = "amd64" || {
            echo "Existing image architecture is not amd64: $IMAGE_ARCH"
            exit 1
          }

          test "$IMAGE_REVISION" = "$GITHUB_SHA" || {
            echo "Existing image revision label does not match GITHUB_SHA."
            exit 1
          }

          echo "Existing immutable image matches the requested Git SHA."
          echo "Digest: ${EXISTING_DIGEST}"
          echo "Platform: ${IMAGE_OS}/${IMAGE_ARCH}"
          echo "Revision: ${IMAGE_REVISION}"

      - name: Set up Docker Buildx
        if: steps.existing-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push Docker image
        if: steps.existing-image.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            IMAGE_SOURCE_COMMIT=${{ github.sha }}

      - name: Resolve final image digest
        id: final-image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$GITHUB_SHA" \
              --region "$AWS_REGION" \
              --query 'imageDetails[0].imageDigest' \
              --output text \
              --no-cli-pager
          )"

          test -n "$IMAGE_DIGEST"
          test "$IMAGE_DIGEST" != "None"

          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Print pushed image information
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.final-image.outputs.digest }}
        shell: bash
        run: |
          echo "Image URI: ${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "Image Digest: ${IMAGE_DIGEST}"

  deploy-to-ecs:
    name: Deploy to Amazon ECS
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure AWS credentials for ECS deployment
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ECS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve current ECS deployment
        id: ecs-deployment
        shell: bash
        run: |
          set -euo pipefail

          TASK_DEFINITION_ARN="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].taskDefinition' \
              --output text \
              --no-cli-pager
          )"

          test -n "$TASK_DEFINITION_ARN"
          test "$TASK_DEFINITION_ARN" != "None"

          CURRENT_IMAGE="$(
            aws ecs describe-task-definition \
              --task-definition "$TASK_DEFINITION_ARN" \
              --region "$AWS_REGION" \
              --query "taskDefinition.containerDefinitions[?name=='${ECS_CONTAINER_NAME}'].image | [0]" \
              --output text \
              --no-cli-pager
          )"

          test -n "$CURRENT_IMAGE"
          test "$CURRENT_IMAGE" != "None"

          AWS_ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query 'Account' \
              --output text \
              --no-cli-pager
          )"

          TARGET_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "task-definition-arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"
          echo "current-image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"
          echo "target-image=$TARGET_IMAGE" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_IMAGE" = "$TARGET_IMAGE" ]; then
            echo "deploy-required=false" >> "$GITHUB_OUTPUT"
            echo "ECS service already uses the requested Git SHA image."
          else
            echo "deploy-required=true" >> "$GITHUB_OUTPUT"
            echo "A new ECS deployment is required."
          fi

          echo "Current task definition: $TASK_DEFINITION_ARN"
          echo "Current image: $CURRENT_IMAGE"
          echo "Target image: $TARGET_IMAGE"

      - name: Render Amazon ECS task definition
        id: task-def
        if: steps.ecs-deployment.outputs.deploy-required == 'true'
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition-arn: ${{ steps.ecs-deployment.outputs.task-definition-arn }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecs-deployment.outputs.target-image }}

      - name: Deploy Amazon ECS task definition
        if: steps.ecs-deployment.outputs.deploy-required == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Print ECS deployment result
        shell: bash
        run: |
          echo "Target image: ${{ steps.ecs-deployment.outputs.target-image }}"

          if [ "${{ steps.ecs-deployment.outputs.deploy-required }}" = "true" ]; then
            echo "ECS deployment completed successfully."
          else
            echo "Deployment skipped because ECS already uses this Git SHA image."
          fi