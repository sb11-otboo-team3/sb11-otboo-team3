name: Build and Push ECR Image

on:
  push:
    branches:
      - develop
      - feature/124-github-actions-ecr
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-push-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: otboo/backend

jobs:
  build-and-push:
    name: Build and Push ECR Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          
      - name: Inspect OIDC claims
        shell: bash
        run: |
          RESPONSE="$(
            curl --fail-with-body --silent \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"
          
          ID_TOKEN="$(echo "${RESPONSE}" | jq -r '.value')"
          
          PAYLOAD="$(
            echo "${ID_TOKEN}" \
              | cut -d '.' -f2 \
              | tr '_-' '/+' \
              | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print}' \
              | base64 --decode
          )"
          
          echo "${PAYLOAD}" | jq '{
            sub: .sub,
            aud: .aud,
            repository: .repository,
            repository_id: .repository_id,
            repository_owner: .repository_owner,
            repository_owner_id: .repository_owner_id,
            ref: .ref
          }'     

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            IMAGE_SOURCE_COMMIT=${{ github.sha }}

      - name: Print pushed image information
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image URI: ${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "Image Digest: ${IMAGE_DIGEST}"
