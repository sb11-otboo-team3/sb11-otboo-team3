name: otboo-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-otboo}
      POSTGRES_USER: ${DB_USERNAME:-otboo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-otboo}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-otboo} -d ${DB_NAME:-otboo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.2
    ports:
      - "127.0.0.1:9092:9092"

  # 로컬 부하테스트용. 앱 자체는 여기 안 담겨있고, 이미 로컬에서 ./gradlew bootRun(local 프로필)으로
  # 떠 있는 앱의 /actuator/prometheus를 스크래핑하는 용도.
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000" # 프론트엔드 dev 서버(3000)와 안 겹치게
    environment:
      # postgres/redis와 동일한 패턴 - .env나 셸 환경변수로 덮어쓸 수 있고, 안 주면 로컬 기본값 사용
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin1234}
    volumes:
      # Prometheus 데이터소스 + 대시보드들을 컨테이너 기동 시 자동으로 구성(수동 클릭 불필요)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data: